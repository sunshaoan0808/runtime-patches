name: build-runtime-patches

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qinglong
            dockerfile: images/qinglong/Dockerfile
          - name: device-harvest
            dockerfile: images/device-harvest/Dockerfile
          - name: omniroute
            dockerfile: images/omniroute/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: sunshaoan0808
          password: ${{ secrets.GH_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/sunshaoan0808/${{ matrix.name }}-patched:latest
